name: Build Backend API Prebuilt Dist

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - '.github/workflows/build-api.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-api-main
  cancel-in-progress: true

jobs:
  build-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'apps/api/package-lock.json'

      - name: Install dependencies & build NestJS API
        working-directory: apps/api
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Package prebuilt dist & commit SHA
        run: |
          API_SHA=$(git log -n 1 --format=%H -- apps/api)
          echo "$API_SHA" > api-dist.sha
          tar -czf api-dist.tar.gz -C apps/api dist
          ls -lh api-dist.tar.gz api-dist.sha

      - name: Publish prebuilt API artifact to GitHub Release (api-latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view api-latest >/dev/null 2>&1; then
            gh release upload api-latest api-dist.tar.gz api-dist.sha --clobber
          else
            gh release create api-latest api-dist.tar.gz api-dist.sha \
              --title "Prebuilt API (latest)" \
              --notes "Automated prebuilt apps/api/dist for fast VPS deployment"
          fi
